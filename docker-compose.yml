version: '3'

services:
  app:
    build:
      args:
        user: crater-user
        uid: 1000
      context: ./
      dockerfile: Dockerfile
      target: base
    image: crater-php
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./docker-compose/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:rw
    networks:
      - crater
      - dokploy-network

  nginx:
    build:
      context: ./
      dockerfile: Dockerfile
      target: nginx
    image: crater-nginx
    restart: unless-stopped
    volumes:
      - ./docker-compose/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - crater
      - dokploy-network

  cron:
    build:
      context: ./
      dockerfile: ./docker-compose/cron.dockerfile
    image: crater-cron
    restart: unless-stopped
    volumes:
      - ./docker-compose/crontab:/etc/crontabs/root:ro
    networks:
      - crater
      - dokploy-network

networks:
  crater:
    driver: bridge
  dokploy-network:
    external: true
